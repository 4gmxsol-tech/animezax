<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="One Piece watch order timeline"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#023e8a"/><stop offset="1" stop-color="#0077b6"/></linearGradient></defs><rect width="1200" height="800" fill="url(#bg)"/><text x="600" y="110" font-family="Arial, sans-serif" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">One Piece Watch Order</text><g fill="#ffffff"><polygon points="600,210 660,380 540,380"/><rect x="592" y="380" width="16" height="90"/><rect x="480" y="470" width="240" height="40" rx="20"/></g><text x="600" y="570" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" text-anchor="middle">Start at episode 1 — follow the sagas in order</text><g><rect x="70" y="620" width="330" height="120" rx="24" fill="#ffffff"/><text x="235" y="712" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#14213d" text-anchor="middle">EAST BLUE</text><text x="235" y="770" font-family="Arial, sans-serif" font-size="30" fill="#14213d" text-anchor="middle">episode 1+</text></g><g><rect x="435" y="620" width="330" height="120" rx="24" fill="#ffffff"/><text x="600" y="712" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#14213d" text-anchor="middle">SAGAS</text><text x="600" y="770" font-family="Arial, sans-serif" font-size="30" fill="#14213d" text-anchor="middle">in story order</text></g><g><rect x="800" y="620" width="330" height="120" rx="24" fill="#ffd166"/><text x="965" y="712" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#14213d" text-anchor="middle">MOVIES</text><text x="965" y="770" font-family="Arial, sans-serif" font-size="30" fill="#14213d" text-anchor="middle">after key arcs</text></g></svg>