name: Internal Link Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate advertising consent and disclosure
        run: python scripts/test_ad_consent.py
      - name: Validate article archive social metadata
        run: python scripts/test_article_index_metadata.py
      - name: Validate decorative article thumbnails and linked headings
        run: python scripts/test_article_archive_accessibility.py
      - name: Validate local links and fragment targets
        run: python scripts/validate_internal_links.py
      - name: Validate Jujutsu Kaisen search snippet metadata
        run: python scripts/validate_priority_seo.py
      - name: Validate Black Clover Season 2 status and official references
        run: python scripts/validate_black_clover_status.py
